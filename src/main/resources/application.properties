# ===============================================================
# APPLICATION METADATA
# ===============================================================
spring.application.name=DeliveryWise

# Active configuration strategy:
# External parameters should be overriden via application-local.properties or environment variables.
spring.profiles.active=local

# ===============================================================
# DATABASE INFRASTRUCTURE & MIGRATION
# ===============================================================
# Flyway Schema Evolution
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate Object-Relational Mapping
spring.jpa.hibernate.ddl-auto=validate
# Hibernate 6 automatically detects the target database dialect upon active connection.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ===============================================================
# HIKARICP CONNECTION POOL OPTIMIZATION
# ===============================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ===============================================================
# CARRIER API INTEGRATION LAYER (Safe Defaults for Public Repository)
# ===============================================================
# Mode selector: 'stub' triggers CarrierApiClientStub, 'prod' activates RestClient transport.
carrier.client.mode=stub
carrier.api.base-url=https://api.deliverywise.enterprise.local
carrier.api.username=anonymous_logistics_user
carrier.api.password=anonymous_secure_placeholder

# ===================================================================
# LOGISTICS ROUTING CONFIGURATION (DEFAULT DEPOT - KYIV SYRETSKA)
# ===================================================================
deliverywise.routing.default-depot.name=\u0411\u0410\u0417\u0410: \u041F\u0410\u0422 \u0421\u041E\u041B\u0414\u0406 \u0406 \u041A\u041E
deliverywise.routing.default-depot.address=\u041A\u0418\u0407\u0412 \u0432\u0443\u043B. \u0421\u0438\u0440\u0435\u0446\u044C\u043A\u0430, 28/2
deliverywise.routing.default-depot.latitude=50.482431
deliverywise.routing.default-depot.longitude=30.465104