# ===============================================================
# APPLICATION METADATA
# ===============================================================
spring.application.name=DeliveryWise

# Active configuration strategy:
# External parameters should be overriden via application-local.properties or environment variables.
spring.profiles.active=local

# ===============================================================
# DATABASE INFRASTRUCTURE & MIGRATION
# ===============================================================
# Flyway Schema Evolution
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate Object-Relational Mapping
spring.jpa.hibernate.ddl-auto=validate
# Hibernate 6 automatically detects the target database dialect upon active connection.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ===============================================================
# HIKARICP CONNECTION POOL OPTIMIZATION
# ===============================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ===============================================================
# CARRIER API INTEGRATION LAYER (Safe Defaults for Public Repository)
# ===============================================================
# Mode selector: 'stub' triggers CarrierApiClientStub, 'prod' activates RestClient transport.
carrier.client.mode=stub
carrier.api.base-url=https://api.deliverywise.enterprise.local
carrier.api.username=anonymous_logistics_user
carrier.api.password=anonymous_secure_placeholder